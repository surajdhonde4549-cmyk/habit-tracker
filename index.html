<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1e0a4e">
<title>Habit Tracker</title>
<style>
/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0d0d1a;
  color:#fff;
  min-height:100%;
  padding-bottom:68px;
  font-size:14px;
  -webkit-text-size-adjust:100%;
}

/* ═══════════════════════════════════════
   HEADER
═══════════════════════════════════════ */
.hdr{
  background:linear-gradient(135deg,#1e0a4e,#0f0530);
  padding:14px 14px 12px;
  border-bottom:3px solid #7b5cff;
  position:sticky;top:0;z-index:20;
}
.app-title{
  font-size:21px;font-weight:900;color:#fff;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.title-dot{
  width:10px;height:10px;border-radius:50%;
  background:#7b5cff;
  box-shadow:0 0 8px #7b5cff;
  animation:blink 2s infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
.sbox{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:8px 4px;text-align:center;
}
.snum{font-size:18px;font-weight:900;display:block;line-height:1;}
.slbl{font-size:8px;color:rgba(255,255,255,0.55);display:block;margin-top:3px;line-height:1.2;font-weight:600;}

/* ═══════════════════════════════════════
   SAVED BAR
═══════════════════════════════════════ */
.savebar{
  background:rgba(52,211,153,0.15);
  color:#34d399;border-bottom:1px solid rgba(52,211,153,0.3);
  text-align:center;padding:6px;font-size:11px;font-weight:700;
  display:none;letter-spacing:0.5px;
}

/* ═══════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:#0d0d1a;border-top:2px solid #2d1b6e;
  display:flex;padding:4px 0 6px;
}
.nav-btn{
  flex:1;border:none;background:transparent;
  color:rgba(255,255,255,0.4);
  font-size:9px;font-weight:700;font-family:Arial,sans-serif;
  cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:6px 4px;
  transition:color 0.2s;
}
.nav-btn.active{color:#a78bfa;}
.nav-ico{font-size:21px;line-height:1;}
.nav-bar{height:3px;width:38px;border-radius:2px;background:transparent;margin-top:2px;}
.nav-btn.active .nav-bar{background:#7b5cff;}

/* ═══════════════════════════════════════
   SCREENS
═══════════════════════════════════════ */
.screen{display:none;padding:14px 12px;}
.screen.active{display:block;}

/* ═══════════════════════════════════════
   MONTH NAV
═══════════════════════════════════════ */
.mnav{
  display:flex;align-items:center;
  justify-content:space-between;margin-bottom:12px;
}
.mnav-btn{
  background:#1e1e3a;border:2px solid #5b3ff0;
  border-radius:9px;color:#fff;
  width:42px;height:42px;font-size:26px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background 0.15s;
}
.mnav-btn:hover{background:#2d2060;}
.mnav-btn:active{background:#3d2d8a;}
.mnav-lbl{font-size:17px;font-weight:900;color:#fff;}

/* ═══════════════════════════════════════
   ADD HABIT
═══════════════════════════════════════ */
.add-box{
  background:#131326;border:2px solid #5b3ff0;
  border-radius:12px;padding:12px;margin-bottom:12px;
}
.add-box input{
  width:100%;background:#1e1e3a;
  border:2px solid #3d3d6b;border-radius:9px;
  padding:12px 14px;color:#fff;font-size:15px;
  margin-bottom:9px;display:block;
  font-family:Arial,sans-serif;
  transition:border-color 0.2s;
}
.add-box input:focus{outline:none;border-color:#7b5cff;background:#251e50;}
.add-box input::placeholder{color:rgba(255,255,255,0.3);}
.add-btn{
  width:100%;background:linear-gradient(135deg,#7b5cff,#9b5de5);
  border:none;border-radius:9px;color:#fff;
  padding:13px;font-size:15px;font-weight:900;
  cursor:pointer;display:block;font-family:Arial,sans-serif;
  transition:opacity 0.15s;
}
.add-btn:hover{opacity:0.9;}
.add-btn:active{opacity:0.75;}

/* ═══════════════════════════════════════
   HABIT GRID
═══════════════════════════════════════ */
.grid-box{
  background:#131326;border:2px solid #5b3ff0;
  border-radius:12px;overflow:hidden;margin-bottom:14px;
}
.grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.grid-scroll::-webkit-scrollbar{height:4px;}
.grid-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);}
.grid-scroll::-webkit-scrollbar-thumb{background:#5b3ff0;border-radius:2px;}
.htbl{border-collapse:collapse;}
.sticky-col{
  position:sticky;left:0;background:#131326;z-index:4;
  min-width:155px;padding:6px 8px;vertical-align:middle;
}
.day-th{
  font-size:8px;font-weight:900;color:rgba(255,255,255,0.45);
  text-align:center;padding:5px 2px 3px;min-width:28px;
  white-space:nowrap;
}
.num-th{
  font-size:9px;font-weight:700;color:rgba(255,255,255,0.55);
  text-align:center;padding:2px 2px 7px;min-width:28px;
}
.num-th.today{color:#a78bfa;font-weight:900;}
.hname-cell{display:flex;align-items:flex-start;gap:4px;}
.h-num{color:#7b5cff;font-weight:900;font-size:12px;flex-shrink:0;padding-top:2px;min-width:18px;}
.h-name{
  color:#e2e8f0;font-weight:700;font-size:12px;flex:1;
  word-break:break-word;white-space:normal;line-height:1.4;
}
.updown{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.ubtn{
  background:rgba(123,92,255,0.22);
  border:1px solid rgba(123,92,255,0.4);
  border-radius:3px;color:#c4b5fd;
  width:22px;height:15px;font-size:10px;
  cursor:pointer;text-align:center;line-height:14px;display:block;
}
.ubtn:hover{background:rgba(123,92,255,0.45);}
.ubtn:active{background:rgba(123,92,255,0.6);}
.delbtn{
  background:rgba(239,68,68,0.18);
  border:1px solid rgba(239,68,68,0.3);
  border-radius:5px;color:#fca5a5;
  width:24px;height:24px;font-size:13px;
  cursor:pointer;text-align:center;line-height:23px;
  display:block;flex-shrink:0;
}
.delbtn:hover{background:rgba(239,68,68,0.4);}
.chk-td{padding:3px 2px;text-align:center;vertical-align:middle;}
.chk{
  width:26px;height:26px;border-radius:6px;
  border:2px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.05);
  display:inline-block;text-align:center;
  line-height:22px;font-size:15px;
  cursor:pointer;color:transparent;
  transition:all 0.15s;
}
.chk:hover{border-color:rgba(255,255,255,0.45);}
.chk:active{transform:scale(0.9);}
.chk.done{background:rgba(52,211,153,0.22);border-color:#34d399;color:#34d399;}
.chk.tcell{border-color:#7b5cff;}
.we{background:rgba(255,255,255,0.012);}
.erow td,.erow .sticky-col{background:rgba(255,255,255,0.014);}
.no-habit{
  text-align:center;color:rgba(255,255,255,0.38);
  padding:22px;font-size:13px;font-weight:700;line-height:1.8;
}

/* ═══════════════════════════════════════
   SLEEP SECTION HEADER
═══════════════════════════════════════ */
.sec-head{
  font-size:14px;font-weight:900;color:#fff;
  margin-bottom:10px;padding-bottom:7px;
  border-bottom:2px solid rgba(123,92,255,0.35);
  display:flex;align-items:center;gap:7px;
}
.sleep-box{
  background:#131326;border:2px solid #5b3ff0;
  border-radius:12px;padding:12px;
}

/* ── LOG INPUT ── */
.log-label{font-size:11px;font-weight:700;color:#a78bfa;margin-bottom:6px;}
.log-row{display:flex;gap:5px;align-items:center;margin-bottom:14px;flex-wrap:nowrap;}
.dsel{
  background:#1e1e3a;border:2px solid #3d3d6b;
  border-radius:9px;padding:10px 4px;
  color:#fff;font-size:12px;
  -webkit-appearance:none;text-align:center;cursor:pointer;
  font-family:Arial,sans-serif;
  transition:border-color 0.2s;
}
.dsel:focus{outline:none;border-color:#7b5cff;}
.dsel option{background:#1e1e3a;color:#fff;}
.dsel.dday{flex:0 0 46px;}
.dsel.dmon{flex:1;}
.dsel.dyr{flex:0 0 70px;}
.hrs-inp{
  background:#1e1e3a;border:2px solid #3d3d6b;
  border-radius:9px;padding:10px 8px;
  color:#fff;font-size:14px;
  width:60px;text-align:center;flex-shrink:0;
  font-family:Arial,sans-serif;
  transition:border-color 0.2s;
}
.hrs-inp:focus{outline:none;border-color:#7b5cff;}
.hrs-inp::placeholder{color:rgba(255,255,255,0.3);}
.log-btn{
  background:linear-gradient(135deg,#1e40af,#7c3aed);
  border:none;border-radius:9px;color:#fff;
  padding:10px 14px;font-size:13px;font-weight:900;
  cursor:pointer;flex-shrink:0;font-family:Arial,sans-serif;
  transition:opacity 0.15s;
}
.log-btn:hover{opacity:0.9;}
.log-btn:active{opacity:0.75;}

/* ── SLEEP HOURS TABLE (FIXED) ── */
.sleep-tbl-wrap{
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin-bottom:14px;border-radius:8px;
  border:1px solid rgba(123,92,255,0.25);
}
.sleep-tbl-wrap::-webkit-scrollbar{height:4px;}
.sleep-tbl-wrap::-webkit-scrollbar-thumb{background:#5b3ff0;border-radius:2px;}
.stbl{border-collapse:collapse;min-width:100%;}
.stbl th{
  font-size:8px;font-weight:900;color:rgba(255,255,255,0.5);
  text-align:center;padding:5px 3px;background:#1a1a38;
  white-space:nowrap;min-width:26px;
}
.stbl td{
  font-size:11px;font-weight:700;text-align:center;
  padding:6px 3px;border-top:1px solid rgba(255,255,255,0.06);
  min-width:26px;
}
.st-fix-th{
  position:sticky;left:0;background:#1a1a38;z-index:3;
  min-width:70px;text-align:left;padding-left:8px;
  color:#a78bfa;font-size:10px;
}
.st-fix-td{
  position:sticky;left:0;background:#131326;z-index:3;
  text-align:left;padding-left:8px;
  color:#a78bfa;font-weight:800;font-size:12px;
}
.sc{border-radius:4px;padding:4px 3px;}
.sc-e{color:rgba(255,255,255,0.2);}
.sc-l{background:rgba(249,115,22,0.2);color:#f97316;}
.sc-n{background:rgba(96,165,250,0.2);color:#60a5fa;}
.sc-g{background:rgba(52,211,153,0.2);color:#34d399;}
.sc-gr{background:rgba(167,139,250,0.2);color:#a78bfa;}
.st-today{border-left:2px solid rgba(167,139,250,0.45);border-right:2px solid rgba(167,139,250,0.45);}

/* ── CHART ── */
.chart-lbl{font-size:11px;font-weight:700;color:#a78bfa;margin-bottom:8px;}
.chart-wrap{position:relative;padding-left:30px;margin-bottom:4px;}
.y-ax{
  position:absolute;left:0;top:0;bottom:0;width:28px;
  display:flex;flex-direction:column;justify-content:space-between;
  align-items:flex-end;padding-right:4px;pointer-events:none;
}
.yl{font-size:8px;color:rgba(255,255,255,0.32);}
.hls{
  position:absolute;left:30px;right:0;top:0;bottom:0;
  display:flex;flex-direction:column;justify-content:space-between;
  pointer-events:none;
}
.hl{height:1px;background:rgba(255,255,255,0.06);}
.bscr{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.bscr::-webkit-scrollbar{height:3px;}
.bscr::-webkit-scrollbar-thumb{background:#5b3ff0;border-radius:2px;}
.brow{display:flex;align-items:flex-end;gap:2px;height:90px;min-width:max-content;}
.bcol{display:flex;flex-direction:column;align-items:center;width:22px;}
.bval{font-size:7px;color:rgba(255,255,255,0.62);font-weight:700;min-height:10px;text-align:center;line-height:1;}
.brect{width:15px;border-radius:3px 3px 0 0;}
.xscr{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.xrow{display:flex;gap:2px;min-width:max-content;margin-top:4px;}
.xcol{width:22px;display:flex;flex-direction:column;align-items:center;gap:1px;}
.xn{font-size:7.5px;color:rgba(255,255,255,0.48);font-weight:700;}
.xd{font-size:7px;color:rgba(255,255,255,0.28);}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.li{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(255,255,255,0.52);}
.ld{width:9px;height:9px;border-radius:2px;}

/* ═══════════════════════════════════════
   NOTES
═══════════════════════════════════════ */
.notes-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.notes-h{font-size:19px;font-weight:900;color:#fff;}
.notes-cnt{
  font-size:11px;color:rgba(255,255,255,0.45);
  background:rgba(123,92,255,0.2);border-radius:20px;padding:3px 10px;
}
.note-add-box{
  background:#131326;border:2px solid #5b3ff0;
  border-radius:14px;padding:14px;margin-bottom:16px;
}
.note-add-lbl{font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:10px;letter-spacing:0.5px;}
.note-ta{
  width:100%;background:#1e1e3a;border:2px solid #3d3d6b;
  border-radius:10px;padding:12px;color:#fff;
  font-size:14px;font-family:Arial,sans-serif;
  resize:none;min-height:90px;line-height:1.5;
  display:block;margin-bottom:10px;
  transition:border-color 0.2s;
}
.note-ta:focus{outline:none;border-color:#7b5cff;background:#251e50;}
.note-ta::placeholder{color:rgba(255,255,255,0.28);}

.img-prev-wrap{margin-bottom:10px;display:none;}
.img-prev-wrap img{
  width:100%;max-height:180px;object-fit:cover;
  border-radius:9px;border:2px solid #5b3ff0;display:block;
}
.remove-img{
  background:rgba(239,68,68,0.18);
  border:1px solid rgba(239,68,68,0.3);
  border-radius:7px;color:#fca5a5;
  font-size:11px;font-weight:700;
  padding:5px 12px;cursor:pointer;
  margin-top:7px;display:inline-block;
}
.note-actions{display:flex;gap:8px;align-items:center;}
.gal-btn{
  background:#1e1e3a;border:2px solid #5b3ff0;
  border-radius:9px;color:#a78bfa;
  padding:10px 14px;font-size:13px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;
  gap:6px;flex-shrink:0;font-family:Arial,sans-serif;
  transition:background 0.15s;
}
.gal-btn:hover{background:#251e50;}
.gal-btn input[type="file"]{display:none;}
.save-note-btn{
  flex:1;background:linear-gradient(135deg,#7b5cff,#c44dff);
  border:none;border-radius:9px;color:#fff;
  padding:11px;font-size:14px;font-weight:900;
  cursor:pointer;font-family:Arial,sans-serif;
  transition:opacity 0.15s;
}
.save-note-btn:hover{opacity:0.9;}
.save-note-btn:active{opacity:0.75;}

.notes-empty{
  text-align:center;color:rgba(255,255,255,0.32);
  font-size:13px;font-weight:700;padding:32px 0;line-height:1.8;
}
.note-card{
  background:#131326;border:2px solid #2d2060;
  border-radius:14px;padding:14px;margin-bottom:12px;
  border-left:4px solid #7b5cff;
}
.note-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:9px;gap:8px;}
.note-dt{display:flex;flex-direction:column;gap:2px;}
.note-date{font-size:11px;font-weight:700;color:#a78bfa;}
.note-time{font-size:10px;color:rgba(255,255,255,0.38);}
.note-del{
  background:rgba(239,68,68,0.14);border:1px solid rgba(239,68,68,0.28);
  border-radius:6px;color:#fca5a5;width:27px;height:27px;
  font-size:13px;cursor:pointer;text-align:center;line-height:26px;
  flex-shrink:0;display:block;
}
.note-del:hover{background:rgba(239,68,68,0.35);}
.note-txt{
  font-size:14px;color:rgba(255,255,255,0.88);
  line-height:1.65;word-break:break-word;white-space:pre-wrap;
}
.note-img{
  width:100%;max-height:210px;object-fit:cover;
  border-radius:9px;border:1px solid #3d2d8a;
  display:block;margin-top:9px;cursor:pointer;
}

/* ═══════════════════════════════════════
   IMAGE VIEWER
═══════════════════════════════════════ */
#iv{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.97);z-index:9990;
  align-items:center;justify-content:center;
}
#iv.show{display:flex;}
#iv img{max-width:95%;max-height:88vh;object-fit:contain;border-radius:9px;}
#iv-close{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,0.12);
  border:2px solid rgba(255,255,255,0.28);
  border-radius:50%;color:#fff;width:40px;height:40px;
  font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toast-area{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  z-index:9999;width:92%;max-width:360px;pointer-events:none;
}
.toast{
  background:rgba(13,5,40,0.97);border:2px solid #7b5cff;
  border-radius:11px;padding:12px 18px;color:#fff;
  font-size:14px;font-weight:700;text-align:center;
  margin-bottom:7px;
  box-shadow:0 6px 24px rgba(0,0,0,0.7);
  animation:tin .3s ease forwards, tout .3s ease 2.1s forwards;
}
@keyframes tin{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
@keyframes tout{from{opacity:1;}to{opacity:0;}}

/* ═══════════════════════════════════════
   DELETE MODAL
═══════════════════════════════════════ */
#dm{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.88);z-index:9998;
  align-items:center;justify-content:center;
}
#dm.show{display:flex;}
.mdl{
  background:#1a1a35;border:2px solid #7b5cff;
  border-radius:18px;padding:26px 20px;
  width:88%;max-width:310px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  animation:popin .25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popin{from{transform:scale(0.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.m-ico{font-size:36px;margin-bottom:10px;}
.m-ttl{font-size:17px;font-weight:900;color:#fff;margin-bottom:7px;}
.m-dsc{font-size:13px;color:rgba(255,255,255,0.58);margin-bottom:20px;line-height:1.5;}
.m-btns{display:flex;gap:10px;}
.m-btns button{
  flex:1;padding:13px;border-radius:11px;border:none;
  font-size:14px;font-weight:900;cursor:pointer;
  font-family:Arial,sans-serif;
}
.m-can{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.75);}
.m-del{background:#ef4444;color:#fff;}
.m-del:hover{background:#dc2626;}
</style>
</head>
<body>

<!-- Toast -->
<div id="toast-area"></div>

<!-- Delete Modal -->
<div id="dm">
  <div class="mdl">
    <div class="m-ico">🗑️</div>
    <div class="m-ttl">Delete Karen?</div>
    <div class="m-dsc" id="m-dsc">Permanently delete hoga.</div>
    <div class="m-btns">
      <button class="m-can" onclick="closeMdl()">Cancel</button>
      <button class="m-del" onclick="confirmDel()">Delete</button>
    </div>
  </div>
</div>

<!-- Image Viewer -->
<div id="iv">
  <button id="iv-close" onclick="closeIV()">✕</button>
  <img id="iv-img" src="" alt="">
</div>

<!-- ═══════ HEADER ═══════ -->
<div class="hdr">
  <div class="app-title">
    <div class="title-dot"></div>
